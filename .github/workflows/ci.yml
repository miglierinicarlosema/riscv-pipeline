# Corre el lint y todos los testbenches en cada push y pull request.
name: RISC-V CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint de cada modulo
        # Revisa cada archivo de rtl/ por separado (latches inferidos, anchos
        # que no coinciden, senales sin usar). Convencion: cada archivo tiene
        # un modulo con su mismo nombre. Si uno falla, el paso se corta y da rojo.
        run: |
          for f in rtl/*.v; do
            m=$(basename "$f" .v)
            echo "Lint de $m"
            verilator --lint-only -Wall -Wno-DECLFILENAME --top-module "$m" rtl/*.v
          done

  simulacion:
    name: Testbenches (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Correr testbenches
        run: bash run_tests.sh
      - name: Guardar formas de onda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formas-de-onda
          path: build/*.vcd
